<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Auth Provider</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <h1>🛡️ Auth Provider</h1>
            <p>Admin Sign-in</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div id="errMsg" style="color: var(--danger); font-size: 13px; font-weight:500; margin-bottom: 15px; display: none;"></div>
                <button type="submit" class="btn-primary full-btn">Sign In to Dashboard</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errMsg = document.getElementById('errMsg');
            
            try {
                const res = await fetch('api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    window.location.href = 'dashboard';
                } else {
                    errMsg.textContent = data.message || 'Invalid credentials';
                    errMsg.style.display = 'block';
                }
            } catch (err) {
                errMsg.textContent = 'Network error. Try again later.';
                errMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
